# Local development stack. Secrets come from .env (never committed).
x-backend: &backend
  build: ./backend
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+psycopg://gtm:${POSTGRES_PASSWORD:-gtm}@db:5432/gtm
    CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtm}
      POSTGRES_DB: gtm
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]  # loopback only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm -d gtm"]
      interval: 3s
      retries: 20

  migrate:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://gtm:${POSTGRES_PASSWORD:-gtm}@db:5432/gtm
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]  # loopback only; put a TLS proxy in front to expose

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker.main"]

  frontend:
    build: ./frontend
    env_file: [.env]
    environment:
      GTM_API_URL: http://api:8000
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  pgdata:
